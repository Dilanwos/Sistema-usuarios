{% extends "base.html" %} {% block title %} Usuarios {% endblock %} {% block
content %}

<h1>Lista de Usuarios</h1>

<table border="1">
  <tr>
    <th>ID</th>
    <th>Nombre</th>
    <th>Email</th>
    <th>Password</th>
  </tr>

  {% for usuario in usuarios %}

  <tr>
    <td>{{ usuario.id }}</td>
    <td>{{ usuario.nombre }}</td>
    <td>{{ usuario.email }}</td>
    <td>{{ usuario.password }}</td>
  </tr>

  {% endfor %}
</table>

{% endblock %}
