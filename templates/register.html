<!doctype html>
<html>
  <head>
    <title>Registro</title>
  </head>
  <body>
    <h1>Registro de Usuario</h1>

    <form method="POST">
      <label>Nombre:</label>
      <input type="text" name="nombre" />

      <br /><br />

      <label>Email:</label>
      <input type="email" name="email" />

      <br /><br />

      <label>Contraseña:</label>
      <input type="password" name="password" />

      <br /><br />

      <button type="submit">Registrar</button>
    </form>
  </body>
</html>
