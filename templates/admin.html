{% extends "base.html" %} {% block title %} Admin Panel {% endblock %} {% block
content %}

<h1>🔐 Panel de Administrador</h1>

<a href="{{ url_for('profile') }}">Volver al perfil</a>

<hr />

<table border="1" cellpadding="10">
  <tr>
    <th>ID</th>
    <th>Nombre</th>
    <th>Email</th>
    <th>Rol</th>
    <th>Acciones</th>
  </tr>

  {% for u in usuarios %}

  <tr>
    <td>{{ u.id }}</td>
    <td>{{ u.nombre }}</td>
    <td>{{ u.email }}</td>
    <td>{{ u.rol }}</td>
    <td>
      <a href="{{ url_for('edit_user', id=u.id) }}"> ✏️ Editar </a>

      |

      <a href="{{ url_for('delete_user', id=u.id) }}"> 🗑 Eliminar </a>
    </td>
  </tr>

  {% endfor %}
</table>

{% endblock %}
